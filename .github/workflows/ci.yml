name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JavaScript dependencies
        run: npm install

      - name: Install review tooling
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run local review checks
        run: ./review-check.sh

      - name: Validate metadata.json
        run: python3 metadata-check.py

      - name: Run JavaScript syntax check
        run: node --check charge-power-monitor@mackrais.gmail.com/extension.js

      - name: Run ESLint
        run: npm run lint

  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    needs: review

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNOME Shell tooling
        run: sudo apt-get update && sudo apt-get install -y gnome-shell

      - name: Show gnome-extensions version
        run: gnome-extensions --version || true

      - name: Pack extension with gnome-extensions
        run: |
          set -euxo pipefail
          uuid="charge-power-monitor@mackrais.gmail.com"
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          gnome-extensions pack "$uuid" \
            --extra-source=icon.svg \
            --extra-source=icon-symbolic.svg \
            --extra-source=icon.png \
            --extra-source=icon-symbolic.png \
            --force --out-dir "$out"
          unzip -l "$out/$uuid.shell-extension.zip"

  build:
    name: Build Bundle
    runs-on: ubuntu-latest
    needs: [review, validate]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run local review checks
        run: ./review-check.sh

      - name: Build extension archive
        run: ./build.sh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: charge-power-monitor-bundle
          path: dist/charge-power-monitor@mackrais.gmail.com.shell-extension.zip
          if-no-files-found: error
